services:
  frontend:
    container_name: dashboard-frontend
    image: m4r4v/frontend:latest
    working_dir: /workspace/app
    volumes:
      - ./frontend/app:/workspace/app
    ports:
      - "3000:3000"
    command: pnpm dev --host
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000

  docs:
    container_name: dashboard-docs
    image: m4r4v/frontend:latest
    working_dir: /workspace
    volumes:
      - ./docs:/workspace
    ports:
      - "5173:5173"
    command: pnpm dev
    environment:
      - NODE_ENV=development

  backend:
    container_name: dashboard-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    ports:
      - "8000:8000"
    command: bash -c "poetry install --no-root && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - PYTHONPATH=/workspace
      - FRONTEND_ORIGINS=http://localhost:3000
      # NUEVO: Conexión a BD (usuario:password@host:puerto/nombre_bd)
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/dashboard_db
    depends_on:
      - db

  # NUEVO SERVICIO DE BASE DE DATOS
  db:
    container_name: dashboard-db
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dashboard_db
    ports:
      - "5432:5432"
    volumes:
      - ./database/data:/var/lib/postgresql/data