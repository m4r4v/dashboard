# ==============================================================================
# ORQUESTADOR V1.1.0 - STATELESS ROOT & HYBRID PERSISTENCE
# ==============================================================================
services:
  
  # --- 1. BACKEND (Python FastAPI) ---
  backend:
    container_name: dashboard-backend
    build:
      context: ./backend          # Contexto de construcción
      dockerfile: Dockerfile      # Dockerfile Multi-Stage
    # Comando Híbrido: Instala dependencias en dev y levanta con Hot-Reload
    command: bash -c "poetry install --no-root && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/workspace      # Espejo de código (RF-06: Persistencia SQLite aquí)
      - ./.env:/workspace/.env    # Inyección de Secretos (RNF-01)
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /workspace
      # Variables de Seguridad Actualizadas
      ROOT_SECRET: ${ROOT_SECRET}
      SYSTEM_PEPPER: ${SYSTEM_PEPPER}  # <--- Nueva variable requerida
      # JWT_SECRET: Eliminado (Se deriva dinámicamente)
      DATABASE_URL: ${DATABASE_URL:-}
    networks:
      - dashboard-net

  # --- 2. FRONTEND (Vue 3 + Vite) ---
  frontend:
    container_name: dashboard-frontend
    image: m4r4v/frontend:latest  # Imagen base (RNF-04)
    # Vite necesita exponerse al host (0.0.0.0) para que lo veas en localhost:3000
    command: sh -c "pnpm config set strict-ssl false && 
         pnpm config set node-linker hoisted && 
         pnpm install --registry=https://registry.npmmirror.com && 
         pnpm dev --host 0.0.0.0"
    volumes:
      - ./frontend/app:/workspace/app # Espejo de código (HMR)
    working_dir: /workspace/app
    ports:
      - "3000:3000"
    environment:
      # RF-10: Configuración para CORS y llamadas API
      VITE_API_URL: http://localhost:8000
    networks:
      - dashboard-net

  # --- 3. DOCUMENTACIÓN (MkDocs) ---
  docs:
    container_name: dashboard-docs
    image: squidfunk/mkdocs-material:latest
    ports:
      - "8080:8000"
    volumes:
      - ./:/docs                  # Lee mkdocs.yml de la raíz
    networks:
      - dashboard-net

# ==============================================================================
# REDES
# ==============================================================================
networks:
  dashboard-net:
    driver: bridge